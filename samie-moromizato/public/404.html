<style>
@font-face{font-family:"Bodoni Moda";font-style:normal;font-weight:400 900;font-display:swap;src:url(/fonts/bodoni-moda.woff2) format("woff2")}
@font-face{font-family:"Bodoni Moda";font-style:italic;font-weight:400 900;font-display:swap;src:url(/fonts/bodoni-moda-italic.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-weight:100 900;font-display:swap;src:url(/fonts/hanken-grotesk.woff2) format("woff2")}
:root{--paper:#f6f4ef;--ink:#131313;--red:#c23b22;--red-dark:#9a2b17;--gray:#6b665e;--gray-soft:#8c867d;--rule:#d6d1c7}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 "Hanken Grotesk",Arial,sans-serif}
::selection{background:var(--red);color:var(--paper)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.draft{background:var(--ink);color:var(--paper);font-size:.75rem;text-align:center;padding:.4rem 1rem;letter-spacing:.04em}
.wrap{max-width:46rem;margin:0 auto;padding:clamp(3rem,10vw,7rem) clamp(1rem,4vw,3rem)}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:clamp(3rem,8vw,6rem)}
.top img{width:6rem;height:auto;mix-blend-mode:multiply}
h1{font:400 clamp(2.5rem,1.6rem + 4.5vw,5rem)/1 "Bodoni Moda",serif;letter-spacing:-.03em;margin:0 0 2rem;text-wrap:balance}
h1 em{font-style:italic}
h2{font:400 1.5rem/1.2 "Bodoni Moda",serif;margin:2.5rem 0 .5rem}
p,li{color:var(--gray);text-wrap:pretty}
a{color:var(--ink)}a:hover{color:var(--red-dark)}
.btn{display:inline-flex;align-items:center;min-height:3rem;padding:.75rem 1.375rem;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;font-size:.875rem;margin-top:2rem}
.btn:hover{background:var(--red-dark);color:var(--paper)}
.rev{display:inline-block;width:1.75rem;height:2px;background:var(--red);transform:rotate(-8deg);vertical-align:middle;margin:0 .5rem}
.lbl{font-size:.8125rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.strike{position:relative;color:var(--gray-soft);font-style:italic}
.strike:after{content:"";position:absolute;left:0;right:0;top:.5em;height:max(2px,.04em);background:var(--red);transform:rotate(-2.5deg)}
</style></head><body>
