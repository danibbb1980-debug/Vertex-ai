<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      /* revelação ao rolar independente do React: nada fica escondido enquanto o JS carrega */
      (function () {
        if (!('IntersectionObserver' in window)) return
        document.documentElement.classList.add('js')
        document.addEventListener('DOMContentLoaded', function () {
          var io = new IntersectionObserver(function (es) {
            es.forEach(function (e) {
              if (e.isIntersecting) { e.target.classList.add('visivel'); io.unobserve(e.target) }
            })
          }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 })
          document.querySelectorAll('.revela').forEach(function (el) { io.observe(el) })
        })
      })()
    </script>
    <!--HEAD-->
    <meta name="theme-color" content="#fbf7f2" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/img/aquarela-topo.webp" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
