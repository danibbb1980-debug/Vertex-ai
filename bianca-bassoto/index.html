<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f0e8" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/comfortaa-300.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/print.css" media="print" />
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('js-motion');
        setTimeout(function () {
          if (!window.__bbReady) d.classList.remove('js', 'js-motion');
        }, 4000);
      })();
    </script>
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
