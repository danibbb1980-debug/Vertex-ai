<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Página não encontrada | Tia Lili</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
<style>
  :root { --creme:#fbf7f1; --cacau:#3a2e28; --taupe:#6a5b50; --menta:#2f6a59; --menta-claro:#e2efe9; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--creme); color:var(--cacau); font:1.0625rem/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; padding:2rem 1.25rem; }
  .blob { width:7rem; height:7rem; margin:0 auto 1.5rem; border-radius:58% 42% 52% 48% / 48% 56% 44% 52%; background:var(--menta-claro); display:grid; place-items:center; }
  img { width:64px; height:auto; }
  h1 { font-family:"Iowan Old Style", Georgia, serif; font-weight:500; font-size:clamp(2rem, 1.5rem + 2.5vw, 2.8rem); line-height:1.15; margin:.25rem 0 .75rem; }
  em { color:var(--menta); }
  p { color:var(--taupe); max-width:30rem; margin:0 auto; }
  a { display:inline-flex; align-items:center; min-height:48px; margin-top:1.75rem; padding:.75rem 1.5rem; border-radius:999px; background:var(--menta); color:#fff; font-weight:700; text-decoration:none; }
  a:focus-visible { outline:3px solid var(--cacau); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <div class="blob"><img src="/marca/logo-200.png" alt="Tia Lili Odontopediatra" width="64" height="72" /></div>
  <h1>Esta página <em>não existe</em>.</h1>
  <p>O endereço pode ter mudado. Volte para o início para conhecer o atendimento da Tia Lili.</p>
  <a href="/">Voltar ao início</a>
</main>
</body>
</html>
