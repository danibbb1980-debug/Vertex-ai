<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root{--marfim:#FBF6F1;--mauve:#7A3E48;--cacau:#2E2124;--texto:#5A474B;--ouro:#B8956A}
    *{box-sizing:border-box}
    body{margin:0;background:var(--marfim);color:var(--cacau);font:17px/1.65 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
    .faixa{background:var(--cacau);color:#fbf6f1e6;font-size:12px;text-align:center;padding:7px 16px}
    main{max-width:720px;margin:0 auto;padding:56px 20px 80px}
    h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;color:var(--mauve);line-height:1.1}
    h1{font-size:2.6rem;margin:.4em 0 .6em} h2{font-size:1.7rem;margin-top:1.6em}
    p,li{color:var(--texto)} a{color:var(--mauve);text-underline-offset:4px}
    a:focus-visible{outline:2px solid var(--mauve);outline-offset:3px;border-radius:4px}
    .filete{height:1px;background:linear-gradient(90deg,transparent,var(--ouro) 20%,var(--ouro) 80%,transparent);margin:32px 0}
    .rotulo{text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:#83643D}
    .botao{display:inline-flex;min-height:48px;align-items:center;padding:0 24px;border-radius:999px;background:var(--mauve);color:#FBF6F1;text-decoration:none}
  </style>
  <title>Página não encontrada | Elane Vasconcelos</title>
</head>
<body>
  <div class="faixa" role="note">Rascunho para avaliação. Informações sujeitas a confirmação.</div>
  <main style="text-align:center">
    <svg aria-hidden="true" viewBox="0 0 64 64" width="88" height="88" fill="none" stroke-linecap="round" style="margin:24px auto 0;display:block">
      <path d="M54.21 13.36A29 29 0 1 1 46.5 6.89" stroke="#B8956A" stroke-width="1.1"/><circle cx="54.21" cy="13.36" r="1.9" fill="#B8956A"/>
      <g stroke="#7A3E48"><path d="M22 21V43" stroke-width="1.9"/><path d="M22 21H30.5M22 32H28.6M22 43H31" stroke-width="1"/><path d="M31.6 21L37.6 43" stroke-width="1.9"/><path d="M37.6 43L43.6 21" stroke-width="1"/></g>
    </svg>
    <p class="rotulo" style="margin-top:28px">Erro 404</p>
    <h1>Esta página não foi encontrada.</h1>
    <p>O endereço pode ter mudado. Volte ao início para ver os atendimentos e pedir seu horário.</p>
    <p style="margin-top:32px"><a class="botao" href="/">Voltar ao início</a></p>
  </main>
</body>
</html>
